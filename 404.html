<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#8d5cf6" />
    <title>Lost bunny · BunnyScout</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh;
        display: grid; place-items: center; padding: 24px;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #20152e;
        background: radial-gradient(circle at 12% 0%, #fff 0, #fbf7ff 35%, #f3edff 100%);
      }
      .card {
        text-align: center; max-width: 460px;
        background: rgba(255,255,255,.9); border: 1px solid #eadff4;
        border-radius: 28px; padding: clamp(28px, 6vw, 48px);
        box-shadow: 0 20px 60px rgba(72,42,117,.16);
      }
      svg { width: 96px; height: 96px; }
      h1 { font-size: 3.4rem; letter-spacing: -.06em; margin: 14px 0 4px; }
      p { color: #6f627a; line-height: 1.55; margin: 0 0 22px; }
      a.btn {
        display: inline-block; text-decoration: none; font-weight: 850;
        background: #8d5cf6; color: #fff; padding: 13px 22px; border-radius: 15px;
        box-shadow: 0 12px 26px rgba(141,92,246,.3); transition: transform .15s ease, background .15s ease;
      }
      a.btn:hover { background: #6037bb; transform: translateY(-1px); }
      @media (prefers-color-scheme: dark) {
        body { color: #f3eefb; background: radial-gradient(circle at 12% 0%, #221a36 0, #140f1f 40%, #0e0a17 100%); }
        .card { background: rgba(33,26,48,.92); border-color: #342a47; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
        p { color: #a99fbb; }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <svg viewBox="0 0 192 192" aria-hidden="true">
        <rect width="192" height="192" rx="44" fill="#8d5cf6"/>
        <ellipse cx="73" cy="66" rx="20" ry="48" fill="#fff"/>
        <ellipse cx="119" cy="66" rx="20" ry="48" fill="#fff"/>
        <circle cx="96" cy="108" r="52" fill="#fff"/>
        <circle cx="78" cy="101" r="7" fill="#20152e"/>
        <circle cx="114" cy="101" r="7" fill="#20152e"/>
        <path d="M91 116c4-4 8-4 12 0-2 5-10 5-12 0z" fill="#ff7aa8"/>
        <path d="M70 132c12 12 40 12 52 0" stroke="#20152e" stroke-width="6" stroke-linecap="round" fill="none"/>
      </svg>
      <h1>404</h1>
      <p>This bunny hopped off the trail. The page you were looking for isn't here.</p>
      <a class="btn" href="https://subchibeats.github.io/bunnyscout-pro/">Back to BunnyScout</a>
    </main>
  </body>
</html>
